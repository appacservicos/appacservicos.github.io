<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AC SERVIÇOS - Ordem de Serviço</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- html2pdf.js para exportação direta em PDF A4 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Arial:wght@400;700&display=swap');

        * {
            font-family: Arial, Helvetica, sans-serif;
            box-sizing: border-box;
        }

        body {
            background-color: #0f172a;
            color: #000000;
            margin: 0;
            padding: 10px 5px;
        }

        .bg-blue-ac { background-color: #003882 !important; }
        .text-blue-ac { color: #003882 !important; }

        /* ESTILOS DO FORMULÁRIO INICIAL MÓVEL (ETAPA 1) */
        .form-mobile-wrap {
            max-width: 650px;
            margin: 10px auto;
            background: #ffffff;
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .form-mobile-wrap h2 {
            color: #003882;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 10px;
            border-bottom: 2px solid #003882;
            padding-bottom: 4px;
            margin-top: 14px;
        }

        .field-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-bottom: 10px;
        }

        .field-group label {
            font-size: 12px;
            font-weight: bold;
            color: #334155;
        }

        .field-group input, .field-group select, .field-group textarea {
            width: 100%;
            min-height: 40px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            padding: 8px 10px;
            font-size: 14px;
            background: #f8fafc;
        }

        .field-group input:focus, .field-group select:focus, .field-group textarea:focus {
            outline: none;
            border-color: #003882;
            background: #ffffff;
        }

        .item-card-mobile {
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 8px;
            position: relative;
        }

        /* CONTAINER FOLHA A4 IDÊNTICO AO ANEXO (ETAPA 2) */
        .page-a4 {
            width: 210mm;
            max-height: 295mm;
            padding: 5mm 6mm;
            margin: 0 auto;
            background: #ffffff;
            border: 1px solid #000000;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            overflow: hidden;
        }

        .os-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: -1px;
            table-layout: fixed;
        }

        .os-table td, .os-table th {
            border: 1px solid #000000;
            padding: 3px 4px;
            font-size: 10px;
            color: #000000;
            vertical-align: middle;
            word-wrap: break-word;
        }

        .header-blue-text-white {
            background-color: #003882 !important;
            color: #ffffff !important;
            font-weight: bold !important;
            text-align: center;
        }

        .header-blue-text-white th {
            color: #ffffff !important;
            font-weight: bold !important;
            padding: 4px 2px;
        }

        .input-field, .select-field {
            width: 100%;
            border: none;
            outline: none;
            background: transparent;
            font-size: 10px;
            color: #000000;
            padding: 1px 0;
            margin: 0;
            appearance: none;
            -webkit-appearance: none;
        }

        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] { -moz-appearance: textfield; }

        .touch-btn {
            min-height: 48px;
            padding: 10px 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            touch-action: manipulation;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            z-index: 999;
            position: relative;
            gap: 8px;
            width: 100%;
        }

        canvas.signature-canvas {
            width: 100%;
            height: 65px;
            cursor: crosshair;
            touch-action: none;
            background-color: #ffffff;
        }

        @media screen and (max-width: 768px) {
            body { padding: 4px; }
            .page-a4 {
                width: 100% !important;
                max-height: none !important;
                padding: 6px !important;
                box-shadow: none !important;
            }
            .table-responsive-mobile {
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
            }
        }

        @page {
            size: A4 portrait;
            margin: 0mm;
        }

        @media print {
            body { background: #ffffff !important; padding: 0 !important; margin: 0 !important; }
            .no-print, #etapa-formulario-inicial, .col-acoes { display: none !important; }
            #etapa-os-documento { display: block !important; }
            .page-a4 {
                box-shadow: none !important;
                border: 1px solid #000000 !important;
                width: 210mm !important;
                max-width: 210mm !important;
                height: 295mm !important;
                max-height: 295mm !important;
                margin: 0 auto !important;
                padding: 5mm 6mm !important;
            }
        }
    </style>
</head>
<body>

    <!-- ETAPA 1: FORMULÁRIO DE PREENCHIMENTO RÁPIDO PARA CELULAR -->
    <div id="etapa-formulario-inicial" class="form-mobile-wrap no-print">
        <div class="flex items-center gap-2 mb-3">
            <span class="bg-blue-ac text-white font-bold px-2 py-1 rounded text-xs">AC SERVIÇOS</span>
            <span class="text-sm font-bold text-gray-800">Preenchimento da O.S. (Celular)</span>
        </div>

        <h2>Dados do Cliente</h2>
        <div class="field-group">
            <label>Cliente:</label>
            <input type="text" id="m-cliente" placeholder="Nome do cliente">
        </div>
        <div class="field-group">
            <label>
